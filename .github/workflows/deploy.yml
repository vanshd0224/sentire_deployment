name: Build & Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

concurrency:
  group: cloud-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Backend Container
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
          docker build -t asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ecommerce-backend-repo/ecommerce-backend:latest ./backend
          docker push asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ecommerce-backend-repo/ecommerce-backend:latest

      - name: Deploy Backend to Cloud Run
        env:
          # Shiprocket Checkout keys, from GitHub secrets (or repo variables).
          # Only set when present, so an empty value never wipes what Cloud Run has.
          SR_KEY: ${{ secrets.SHIPROCKET_CHECKOUT_API_KEY || vars.SHIPROCKET_CHECKOUT_API_KEY }}
          SR_SECRET: ${{ secrets.SHIPROCKET_CHECKOUT_API_SECRET || vars.SHIPROCKET_CHECKOUT_API_SECRET }}
          # Shiprocket API user, for courier tracking on the Track Order page
          SR_API_EMAIL: ${{ secrets.SHIPROCKET_API_EMAIL || vars.SHIPROCKET_API_EMAIL }}
          SR_API_PASSWORD: ${{ secrets.SHIPROCKET_API_PASSWORD }}
          # MongoDB Atlas connection string (partners, orders, chat history, leads)
          DB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          VARS=()
          if [ -n "$DB_URI" ]; then
            VARS+=("MONGODB_URI=${DB_URI}")
          fi
          if [ -n "$SR_KEY" ] && [ -n "$SR_SECRET" ]; then
            VARS+=("SHIPROCKET_CHECKOUT_API_KEY=${SR_KEY}" "SHIPROCKET_CHECKOUT_API_SECRET=${SR_SECRET}")
          fi
          if [ -n "$SR_API_EMAIL" ] && [ -n "$SR_API_PASSWORD" ]; then
            VARS+=("SHIPROCKET_API_EMAIL=${SR_API_EMAIL}" "SHIPROCKET_API_PASSWORD=${SR_API_PASSWORD}")
          fi
          ENV_FLAGS=()
          if [ ${#VARS[@]} -gt 0 ]; then
            # "^|^" makes | the separator, so values may contain commas
            ENV_FLAGS=(--update-env-vars "^|^$(IFS='|'; echo "${VARS[*]}")")
          fi
          gcloud run deploy ecommerce-backend \
            --image asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ecommerce-backend-repo/ecommerce-backend:latest \
            --region asia-south1 \
            --min-instances=1 \
            --allow-unauthenticated \
            --port 8080 \
            "${ENV_FLAGS[@]}" \
            --quiet

  deploy-frontend:
    name: Deploy Frontend to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Frontend Container
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
          docker build -t asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ecommerce-frontend-repo/ecommerce-frontend:latest ./frontend
          docker push asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ecommerce-frontend-repo/ecommerce-frontend:latest

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy ecommerce-frontend \
            --image asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ecommerce-frontend-repo/ecommerce-frontend:latest \
            --region asia-south1 \
            --min-instances=1 \
            --allow-unauthenticated \
            --port 8080 \
            --quiet

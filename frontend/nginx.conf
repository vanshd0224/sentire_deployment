server {
    listen 8080 default_server;
    server_name sentirebypc.com www.sentirebypc.com _;
    root /usr/share/nginx/html;
    index index.html;

    port_in_redirect off;
    absolute_redirect off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------
    # 1. Host Consolidation & WWW Redirection
    # -------------------------------------------------------------
    if ($host = 'www.sentirebypc.com') {
        return 301 https://sentirebypc.com$request_uri;
    }

    # -------------------------------------------------------------
    # 2. Legacy Shopify 301 URL Migration Rules
    # -------------------------------------------------------------
    # Legacy Collections
    location ~* ^/collections/(?:best-sellers|bestsellers) {
        return 301 https://sentirebypc.com/bestsellers;
    }
    location ~* ^/collections/new-arrivals {
        return 301 https://sentirebypc.com/new-arrivals;
    }
    location ~* ^/collections/ {
        return 301 https://sentirebypc.com/perfumes;
    }

    # Legacy Products Direct Redirects to Canonical Fragrance URLs
    location ~* ^/products/.*dapper.*$ {
        return 301 https://sentirebypc.com/perfumes/dapper;
    }
    location ~* ^/products/.*woo-?dy.*$ {
        return 301 https://sentirebypc.com/perfumes/woo-dy;
    }
    location ~* ^/products/.*white-?oud.*$ {
        return 301 https://sentirebypc.com/perfumes/white-oud;
    }
    location ~* ^/products/.*purple-?oud.*$ {
        return 301 https://sentirebypc.com/perfumes/purple-oud;
    }
    location ~* ^/products/.*calantha.*$ {
        return 301 https://sentirebypc.com/perfumes/calantha;
    }
    location ~* ^/products/.*deep-?crush.*$ {
        return 301 https://sentirebypc.com/perfumes/deep-crush;
    }
    location ~* ^/products/.*herrlich.*$ {
        return 301 https://sentirebypc.com/perfumes/herrlich;
    }
    location ~* ^/products/.*midnight.*$ {
        return 301 https://sentirebypc.com/perfumes/midnight;
    }
    location ~* ^/products/.*mirai.*$ {
        return 301 https://sentirebypc.com/perfumes/mirai;
    }
    location ~* ^/products/.*(?:0809|o809).*$ {
        return 301 https://sentirebypc.com/perfumes/0809;
    }
    location ~* ^/products/.*personna.*$ {
        return 301 https://sentirebypc.com/perfumes/personna;
    }
    location ~* ^/products/.*rich.*$ {
        return 301 https://sentirebypc.com/perfumes/rich;
    }
    location ~* ^/products/.*seductive.*$ {
        return 301 https://sentirebypc.com/perfumes/seductive;
    }
    location ~* ^/products/.*zephyrine.*$ {
        return 301 https://sentirebypc.com/perfumes/zephyrine;
    }
    location ~* ^/products/.*bijou.*$ {
        return 301 https://sentirebypc.com/perfumes/bijou;
    }
    location ~* ^/products/.*vanaco.*$ {
        return 301 https://sentirebypc.com/perfumes/vanaco;
    }
    location ~* ^/products/.*sent-?aura.*$ {
        return 301 https://sentirebypc.com/perfumes/sent-aura;
    }
    location ~* ^/products/.*le-?chocolat.*$ {
        return 301 https://sentirebypc.com/perfumes/le-chocolat;
    }
    location ~* ^/products/.*pc-?leather.*$ {
        return 301 https://sentirebypc.com/perfumes/pc-leather;
    }
    location ~* ^/products/.*reiz.*$ {
        return 301 https://sentirebypc.com/perfumes/reiz;
    }
    location ~* ^/products/.*quantillion.*$ {
        return 301 https://sentirebypc.com/perfumes/quantillion;
    }
    location ~* ^/products/.*$ {
        return 301 https://sentirebypc.com/perfumes;
    }
    location ~* ^/product/.*$ {
        return 301 https://sentirebypc.com/perfumes;
    }

    # Legacy Pages
    location ~* ^/pages/personalised-perfume {
        return 301 https://sentirebypc.com/personalised-perfume;
    }
    location = /personalisation {
        return 301 https://sentirebypc.com/personalised-perfume;
    }
    location ~* ^/pages/personalisation {
        return 301 https://sentirebypc.com/personalised-perfume;
    }
    location ~* ^/pages/35-percent-extrait-de-parfum {
        return 301 https://sentirebypc.com/extrait-de-parfum;
    }
    location ~* ^/pages/(?:about-us|about-sentire|about|our-story) {
        return 301 https://sentirebypc.com/about;
    }
    location = /about-us {
        return 301 https://sentirebypc.com/about;
    }
    location = /about-sentire {
        return 301 https://sentirebypc.com/about;
    }
    location ~* ^/pages/(?:contact-us|contact|faqs|shipping-returns|privacy-policy|terms-of-service) {
        return 301 https://sentirebypc.com/client-services;
    }
    location ~* ^/pages/track(?:-your)?-order {
        return 301 https://sentirebypc.com/track-order;
    }
    location = /track-your-order {
        return 301 https://sentirebypc.com/track-order;
    }
    location ~* ^/pages/celebs {
        return 301 https://sentirebypc.com/;
    }

    # -------------------------------------------------------------
    # 3. IndexNow Verification File
    # -------------------------------------------------------------
    location = /c7e48b39401b4424a1b0288f3478912e.txt {
        default_type text/plain;
        return 200 "c7e48b39401b4424a1b0288f3478912e\n";
    }

    # -------------------------------------------------------------
    # 4. Static Assets Long-Term Caching
    # -------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Sitemap — serve with correct MIME type for Googlebot
    location = /sitemap.xml {
        add_header Content-Type "application/xml";
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Robots.txt — serve explicitly
    location = /robots.txt {
        add_header Content-Type "text/plain";
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # HTML, JS, CSS — No-Store for Instant Updates
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache, no-store, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Static Images & Media Assets
    location ~* \.(?:ico|gif|jpe?g|png|webp|svg|json|txt|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    default_type text/html;

    # -------------------------------------------------------------
    # 5. Explicit Canonical Routes (Direct HTTP 200 Serving)
    # -------------------------------------------------------------
    location = /personalised-perfume {
        try_files /personalised-perfume/index.html /personalised-perfume.html /index.html;
    }
    location = /extrait-de-parfum {
        try_files /extrait-de-parfum/index.html /extrait-de-parfum.html /index.html;
    }
    location = /byob {
        try_files /byob/index.html /byob.html /index.html;
    }
    location = /bestsellers {
        try_files /bestsellers/index.html /bestsellers.html /index.html;
    }
    location = /new-arrivals {
        try_files /new-arrivals/index.html /new-arrivals.html /index.html;
    }
    location = /perfumes {
        try_files /perfumes/index.html /perfumes.html /index.html;
    }
    location ~* ^/perfumes/([a-zA-Z0-9_-]+)$ {
        try_files /perfumes/$1/index.html /perfumes/$1.html /perfumes/index.html /index.html;
    }
    location = /about {
        try_files /about/index.html /about.html /index.html;
    }
    location = /client-services {
        try_files /client-services/index.html /client-services.html /index.html;
    }
    location = /track-order {
        try_files /track-order/index.html /track-order.html /index.html;
    }

    # -------------------------------------------------------------
    # 6. Universal SPA Fallback
    # -------------------------------------------------------------
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html /index.html;
    }
}


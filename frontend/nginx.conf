server {
    listen 8080 default_server;
    server_name sentirebypc.com www.sentirebypc.com _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------
    # 1. Host Consolidation & WWW Redirection
    # -------------------------------------------------------------
    if ($host = 'www.sentirebypc.com') {
        return 301 https://sentirebypc.com$request_uri;
    }

    # -------------------------------------------------------------
    # 2. Legacy Shopify 301 URL Migration Rules
    # -------------------------------------------------------------
    # Legacy Collections
    location ~* ^/collections/(?:best-sellers|bestsellers) {
        return 301 https://sentirebypc.com/bestsellers;
    }
    location ~* ^/collections/new-arrivals {
        return 301 https://sentirebypc.com/new-arrivals;
    }
    location ~* ^/collections/ {
        return 301 https://sentirebypc.com/perfumes;
    }

    # Legacy Pages
    location ~* ^/pages/(?:about-us|about|our-story) {
        return 301 https://sentirebypc.com/about;
    }
    location ~* ^/pages/(?:contact-us|contact) {
        return 301 https://sentirebypc.com/client-services;
    }
    location ~* ^/pages/celebs {
        return 301 https://sentirebypc.com/;
    }

    # Legacy Products Deep Link Redirect
    location ~* ^/products/(.+)$ {
        return 301 https://sentirebypc.com/perfumes?id=$1;
    }
    location ~* ^/product/(.+)$ {
        return 301 https://sentirebypc.com/perfumes?id=$1;
    }

    # -------------------------------------------------------------
    # 3. IndexNow Verification File
    # -------------------------------------------------------------
    location = /c7e48b39401b4424a1b0288f3478912e.txt {
        default_type text/plain;
        return 200 "c7e48b39401b4424a1b0288f3478912e\n";
    }

    # -------------------------------------------------------------
    # 4. Static Assets Long-Term Caching
    # -------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|xml|json|txt)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # -------------------------------------------------------------
    # 5. SPA Routing Fallback
    # -------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
